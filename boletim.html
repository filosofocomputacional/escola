<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'&gt;&lt;text y='24' font-size='27'&gt;📋&lt;/text&gt;&lt;/svg&gt;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📋 Boletim Escolar Nova Contagem</title>
  <style>
    :root {
      --primary: #1e40af;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --warning: #f59e0b;
      --success: #16a34a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1rem;
    }
    .container { max-width: 1200px; width: 100%; }
    header { text-align: center; margin-bottom: 2rem; }
    header h1 { color: var(--primary); font-size: 2rem; margin-bottom: 0.5rem; }
    header p { color: #64748b; }

    /* Tela de Seleção */
    .selection-card {
      background: var(--card);
      padding: 3rem 2rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 600px;
      width: 100%;
      margin: 2rem auto;
    }
    .selection-card h2 { color: var(--primary); margin-bottom: 1rem; font-size: 1.8rem; }
    .selection-card p { color: #64748b; margin-bottom: 2rem; }
    .btn-grid { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn-serie {
      background: var(--card);
      border: 2px solid var(--primary);
      color: var(--primary);
      padding: 1.2rem 1.5rem;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      flex: 1;
      min-width: 140px;
    }
    .btn-serie:hover {
      background: var(--primary);
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(30, 64, 175, 0.2);
    }

    .search-box {
      background: var(--card);
      padding: 1.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      margin-bottom: 2rem;
      position: relative;
    }
    .search-box label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--text);
    }
    .input-wrapper { position: relative; }
    .search-box input, .search-box select {
      width: 100%;
      padding: 1rem 3rem 1rem 1rem;
      font-size: 1.1rem;
      border: 2px solid var(--border);
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box input:focus, .search-box select:focus { border-color: var(--primary); }
    .btn-clear {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      font-size: 1.2rem;
      color: #94a3b8;
      cursor: pointer;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      z-index: 5;
    }
    .btn-clear:hover {
      background: #f1f5f9;
      color: var(--danger);
    }
    .btn-clear.hidden { display: none; }
    .loading-indicator {
      font-size: 0.9rem;
      color: #64748b;
      margin-top: 0.5rem;
      text-align: center;
      font-style: italic;
    }

    .autocomplete-wrapper { position: relative; }
    .autocomplete-dropdown {
      position: absolute;
      top: 100%; left: 0; right: 0;
      background: var(--card);
      border: 2px solid var(--primary);
      border-top: none;
      border-radius: 0 0 8px 8px;
      max-height: 320px;
      overflow-y: auto;
      z-index: 100;
      box-shadow: 0 8px 16px rgba(0,0,0,0.12);
      display: none;
    }
    .autocomplete-dropdown.open { display: block; animation: slideDown 0.2s ease; }
    .autocomplete-item {
      padding: 0.85rem 1rem;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .autocomplete-item:last-child { border-bottom: none; }
    .autocomplete-item:hover, .autocomplete-item.highlighted { background: #eff6ff; }
    .autocomplete-item .name { font-weight: 500; color: var(--text); }
    .autocomplete-item .name mark { background: #fef08a; color: var(--text); padding: 0 2px; border-radius: 2px; }
    .autocomplete-item .class-tag {
      font-size: 0.75rem;
      background: var(--primary);
      color: white;
      padding: 2px 8px;
      border-radius: 10px;
      white-space: nowrap;
    }
    .autocomplete-empty { padding: 1rem; text-align: center; color: #94a3b8; font-style: italic; }

    .boletim {
      background: var(--card);
      border-radius: 12px;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
      overflow: hidden;
      display: none;
      border: 1px solid var(--border);
    }
    .boletim.active { display: block; animation: fadeIn 0.4s ease; }
    .boletim-header {
      background: var(--primary);
      color: white;
      padding: 1.5rem;
      text-align: center;
    }
    .boletim-header h2 { font-size: 1.8rem; margin-bottom: 0.3rem; }
    .boletim-header p { font-size: 1.1rem; opacity: 0.9; }

    .alert-critical {
      background-color: var(--danger-bg);
      border-left: 6px solid var(--danger);
      padding: 1rem 1.5rem;
      margin: 1.5rem;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .alert-critical .icon { font-size: 2rem; }
    .alert-critical .text h4 { color: var(--danger); margin-bottom: 0.2rem; font-size: 1.2rem; }
    .alert-critical .text p { color: #991b1b; font-size: 0.95rem; }

    .grades-table { padding: 0 1.5rem 1.5rem; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { padding: 0.8rem 1rem; text-align: left; border-bottom: 1px solid var(--border); }
    th { background-color: #f1f5f9; font-weight: 600; color: #475569; text-transform: uppercase; font-size: 0.85rem; }
    tr:last-child td { border-bottom: none; }
    tr:hover { background-color: #f8fafc; }
    .grade-value { font-weight: 600; font-size: 1.1rem; }
    .grade-danger { color: var(--danger); }
    .grade-ok { color: var(--text); }

    .boletim-footer {
      background: #f1f5f9;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border);
    }
    .stat { display: flex; flex-direction: column; }
    .stat-label { font-size: 0.8rem; color: #64748b; text-transform: uppercase; font-weight: 600; }
    .stat-value { font-size: 1.2rem; font-weight: 700; }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--border);
      flex-wrap: nowrap;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .tab-btn {
      background: none;
      border: none;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: 600;
      color: #64748b;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .tab-btn:hover { color: var(--primary); }
    .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
    .btn-voltar {
      background: #e2e8f0;
      color: #475569;
      border: none;
      padding: 8px 14px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      margin-left: auto;
      transition: background 0.2s;
      white-space: nowrap;
    }
    .btn-voltar:hover { background: #cbd5e1; color: #1e293b; }
    .tab-content { display: none; }
    .tab-content.active { display: block; animation: fadeIn 0.4s ease; }

    /* Filtro de Trimestre */
    .trimestre-filter {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }
    .trimestre-btn {
      padding: 8px 16px;
      border: 2px solid var(--primary);
      background: white;
      color: var(--primary);
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }
    .trimestre-btn.active {
      background: var(--primary);
      color: white;
    }
    .trimestre-btn:hover:not(.active) {
      background: #eff6ff;
    }

    .class-table-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,.08);
      margin-bottom: 20px;
    }
    .class-table-wrapper {
      overflow-x: auto;
      margin-top: 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .class-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    .class-table th {
      background-color: var(--primary);
      color: white;
      padding: 10px 6px;
      text-align: center;
      border: 1px solid #1e3a8a;
      font-size: 0.85rem;
    }
    .class-table th:first-child {
      text-align: left;
      min-width: 160px;
      position: sticky;
      left: 0;
      z-index: 3;
      background-color: var(--primary);
    }
    .class-table td {
      padding: 8px 6px;
      text-align: center;
      border: 1px solid var(--border);
      font-weight: 600;
      font-size: 0.85rem;
    }
    .class-table td:first-child {
      text-align: left;
      background-color: #f8fafc;
      min-width: 160px;
      position: sticky;
      left: 0;
      z-index: 2;
      box-shadow: 2px 0 5px rgba(0,0,0,0.05);
      font-size: 0.85rem;
    }
    .class-table td.grade-danger { background-color: var(--danger-bg); color: var(--danger); }
    .class-table td.grade-ok { background-color: #f0fdf4; color: var(--success); }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

    /* 📱 Ajustes para CELULAR — fontes menores na tabela do boletim */
    @media (max-width: 768px) {
      body { padding: 1rem 0.5rem; }
      header h1 { font-size: 1.6rem; }
      .btn-serie { min-width: 100%; }
      .tabs { flex-wrap: nowrap; gap: 5px; }
      .tab-btn { padding: 10px 12px; font-size: 0.85rem; }
      .boletim-footer { flex-direction: column; gap: 10px; text-align: center; }

      /* Tabela de notas — fontes reduzidas */
      .grades-table { padding: 0 1rem 1rem; }
      .grades-table th, .grades-table td {
        padding: 0.5rem 0.4rem;
        font-size: 0.8rem;
      }
      .grade-value { font-size: 0.9rem; }
      .boletim-header h2 { font-size: 1.3rem; }
      .boletim-header p { font-size: 0.95rem; }

      /* Tabela por turma */
      .class-table { font-size: 0.75rem; }
      .class-table th, .class-table td { padding: 6px 4px; font-size: 0.75rem; }
      .class-table th:first-child, .class-table td:first-child { min-width: 120px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Tela de Seleção de Série -->
    <div id="selectionScreen" class="selection-card">
      <h2>📋 Boletim Escolar Nova Contagem</h2>
      <p>Selecione a série que deseja consultar:</p>
      <div class="btn-grid">
        <button onclick="selectSerie('8_ano')" class="btn-serie">🎓 8º Ano</button>
        <button onclick="selectSerie('9_ano')" class="btn-serie">🎓 9º Ano</button>
        <button onclick="selectSerie('1_EM')" class="btn-serie">📚 1º EM</button>
        <button onclick="selectSerie('2_EM')" class="btn-serie">📚 2º EM</button>
        <button onclick="selectSerie('3_EM')" class="btn-serie">📚 3º EM</button>
        <button onclick="selectSerie('tecnico')" class="btn-serie">🛠️ Técnico</button>
      </div>
    </div>

    <!-- Conteúdo Principal -->
    <div id="mainContent" style="display: none;">
      <header>
        <h1 id="mainTitle">📋 Boletim Escolar</h1>
        <p id="mainSubtitle"></p>
      </header>

      <div class="tabs">
        <button id="btnTabSearch" class="tab-btn active" onclick="showTab('tabSearch', this)">🔍 Buscar Aluno</button>
        <button id="btnTabClass" class="tab-btn" onclick="showTab('tabClass', this)">📋 Boletim por Turma</button>
        <button class="btn-voltar" onclick="backToSelection()">🔄 Trocar Série</button>
      </div>

      <!-- Aba: Buscar Aluno -->
      <div id="tabSearch" class="tab-content active">
        <div class="search-box">
          <label for="searchInput">Digite o nome do aluno:</label>
          <div class="autocomplete-wrapper input-wrapper">
            <input type="text" id="searchInput" placeholder="Ex: Digite o nome..." disabled>
            <button type="button" id="btnClear" class="btn-clear hidden" title="Limpar pesquisa">✕</button>
            <div id="autocompleteDropdown" class="autocomplete-dropdown"></div>
          </div>
          <div id="loadingStatus" class="loading-indicator">🔄 Carregando dados...</div>
        </div>

        <div id="boletimCard" class="boletim">
          <div class="boletim-header">
            <h2 id="studentName">Nome do Aluno</h2>
            <p id="studentClass">Turma</p>
          </div>
          <div id="criticalAlert" class="alert-critical" style="display: none;">
            <div class="icon">⚠️</div>
            <div class="text">
              <h4>Atenção!</h4>
              <p id="criticalText"></p>
            </div>
          </div>
          <div class="grades-table">
            <table>
              <thead>
                <tr>
                  <th>Disciplina</th>
                  <th>1º Tri</th>
                  <th>2º Tri</th>
                  <th>Situação</th>
                </tr>
              </thead>
              <tbody id="gradesBody"></tbody>
            </table>
          </div>
          <div class="boletim-footer">
            <div class="stat">
              <span class="stat-label">Média Geral</span>
              <span id="studentAvg" class="stat-value">0.0</span>
            </div>
            <div class="stat">
              <span class="stat-label">Abaixo de 18</span>
              <span id="studentBelowCount" class="stat-value" style="color: var(--danger);">0</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Aba: Boletim por Turma -->
      <div id="tabClass" class="tab-content">
        <div class="search-box">
          <label for="classSelect">Selecione uma Turma:</label>
          <select id="classSelect" disabled>
            <option value="">Carregando turmas...</option>
          </select>
        </div>

        <!-- 🔘 Botões de Trimestre -->
        <div class="trimestre-filter" id="trimestreFilter" style="display: none;">
          <button class="trimestre-btn active" data-trimestre="todos">📊 Todos</button>
          <button class="trimestre-btn" data-trimestre="1">1º Trimestre</button>
          <button class="trimestre-btn" data-trimestre="2">2º Trimestre</button>
        </div>

        <div id="classBoletimCard" class="class-table-card boletim" style="display: none;">
          <div class="boletim-header" style="border-radius: 12px 12px 0 0;">
            <h2 id="classTitle">Boletim da Turma</h2>
          </div>
          <div class="class-table-wrapper">
            <table class="class-table">
              <thead id="classTableHead"></thead>
              <tbody id="classTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 📋 Arquivos JSON
    const FILES = {
      '8_ano': { nome: '8º Ano', url: '8_ano.json' },
      '9_ano': { nome: '9º Ano', url: '9_ano.json' },
      '1_EM': { nome: '1º Ensino Médio', url: '1_EM.json' },
      '2_EM': { nome: '2º Ensino Médio', url: '2_EM.json' },
      '3_EM': { nome: '3º Ensino Médio', url: '3_EM.json' },
      'tecnico': { nome: 'Ensino Técnico', url: 'tecnico.json' }
    };

    const MAX_AUTOCOMPLETE = 10;
    let allStudents = [];
    let allClasses = {};
    let highlightedIndex = -1;
    let currentMatches = [];
    let currentSerie = null;
    let currentTurmaSelecionada = null;
    let trimestreAtual = 'todos';

    // ------------------- Formatar Nome: 1º nome + 3 letras do 2º -------------------
    function formatarNome(nomeCompleto) {
      if (!nomeCompleto) return "—";
      const partes = nomeCompleto.trim().split(/\s+/);
      if (partes.length === 1) return partes[0];
      const primeiro = partes[0];
      const segundo = partes[1];
      const abreviatura = segundo.length >= 3 ? segundo.substring(0, 3) + '.' : segundo;
      return `${primeiro} ${abreviatura}`;
    }

    // ------------------- Tela de Seleção -------------------
    function selectSerie(serieKey) {
      currentSerie = serieKey;
      document.getElementById("mainSubtitle").textContent = `Série: ${FILES[serieKey].nome}`;
      document.getElementById("selectionScreen").style.display = "none";
      document.getElementById("mainContent").style.display = "block";
      loadData();
    }

    function backToSelection() {
      document.getElementById("mainContent").style.display = "none";
      document.getElementById("selectionScreen").style.display = "block";
      document.getElementById("searchInput").value = "";
      document.getElementById("btnClear").classList.add("hidden");
      document.getElementById("boletimCard").classList.remove("active");
      document.getElementById("classSelect").value = "";
      document.getElementById("classBoletimCard").style.display = "none";
      document.getElementById("trimestreFilter").style.display = "none";
      allStudents = [];
      allClasses = {};
      currentTurmaSelecionada = null;
    }

    // ------------------- Carregar Dados -------------------
    async function loadData() {
      const searchInput = document.getElementById("searchInput");
      const btnClear = document.getElementById("btnClear");
      const loadingStatus = document.getElementById("loadingStatus");
      const classSelect = document.getElementById("classSelect");

      try {
        loadingStatus.textContent = "🔄 Carregando...";
        loadingStatus.style.color = "";

        const res = await fetch(FILES[currentSerie].url + "?t=" + Date.now());
        if (!res.ok) throw new Error("Arquivo não encontrado");
        
        const raw = await res.json();
        allStudents = processData(raw);

        // Agrupa por turma
        allClasses = {};
        allStudents.forEach(s => {
          if (!allClasses[s.turma]) allClasses[s.turma] = [];
          allClasses[s.turma].push(s);
        });

        populateClassSelect();

        loadingStatus.textContent = `✅ ${allStudents.length} alunos carregados`;
        loadingStatus.style.color = "var(--success)";
        searchInput.disabled = false;
        classSelect.disabled = false;

      } catch (err) {
        console.error(err);
        loadingStatus.textContent = `❌ Erro: ${err.message}. Verifique se ${FILES[currentSerie].url} está na pasta.`;
        loadingStatus.style.color = "var(--danger)";
      }
    }

    // ------------------- Processar Dados -------------------
    function processData(raw) {
      return raw.map(item => {
        const alunoCompleto = item.aluno || item.ALUNO || "Sem nome";
        const turma = item.turma || item.Turma || "Sem turma";
        const notas = item.notas || {};

        const disciplinas = Object.entries(notas).map(([nome, vals]) => ({
          nome,
          trim1: parseNota(vals['1º_trimestre']),
          trim2: parseNota(vals['2º_trimestre'])
        }));

        medias = disciplinas.map(d => {
          valido = [d.trim1, d.trim2].filter(n => n !== null);
          return valido.length ? valido.reduce((a,b) => a+b, 0) / valido.length : null;
        });

        abaixo = medias.filter(m => m !== null && m < 18).length;
        validas = medias.filter(m => m !== null);
        mediaGeral = validas.length ? validas.reduce((a,b) => a+b, 0) / validas.length : 0;

        return {
          nomeCompleto: alunoCompleto,
          nome: formatarNome(alunoCompleto),
          turma,
          disciplinas,
          medias,
          abaixo,
          mediaGeral
        };
      });
    }

    function parseNota(val) {
      if (val === null || val === undefined || val === '') return null;
      if (typeof val === 'number') return isNaN(val) ? null : val;
      const num = parseFloat(String(val).replace(',', '.'));
      return isNaN(num) ? null : num;
    }

    // ------------------- Abas -------------------
    function showTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      if (btn) btn.classList.add('active');
    }

    // ------------------- Busca e Autocomplete -------------------
    function populateClassSelect() {
      const select = document.getElementById("classSelect");
      select.innerHTML = '<option value="">Selecione uma turma...</option>';
      Object.keys(allClasses).sort().forEach(turma => {
        const opt = document.createElement("option");
        opt.value = turma;
        opt.textContent = `${turma} (${allClasses[turma].length} alunos)`;
        select.appendChild(opt);
      });
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function highlightMatch(text, query) {
      if (!query) return escapeHtml(text);
      const idx = text.toLowerCase().indexOf(query.toLowerCase());
      if (idx === -1) return escapeHtml(text);
      return escapeHtml(text.slice(0, idx)) + 
             `<mark>${escapeHtml(text.slice(idx, idx+query.length))}</mark>` + 
             escapeHtml(text.slice(idx+query.length));
    }

    function updateAutocomplete(query) {
      const dropdown = document.getElementById("autocompleteDropdown");
      const btnClear = document.getElementById("btnClear");
      const q = query.trim();
      
      // Mostra/esconde botão de limpar
      if (q) {
        btnClear.classList.remove("hidden");
      } else {
        btnClear.classList.add("hidden");
        closeAutocomplete();
        return;
      }

      currentMatches = allStudents
        .filter(s => s.nomeCompleto.toLowerCase().includes(q.toLowerCase()))
        .slice(0, MAX_AUTOCOMPLETE);
      highlightedIndex = -1;

      if (currentMatches.length === 0) {
        dropdown.innerHTML = `<div class="autocomplete-empty">Nenhum aluno encontrado</div>`;
        dropdown.classList.add('open');
        return;
      }

      dropdown.innerHTML = currentMatches.map((s, i) => `
        <div class="autocomplete-item" data-index="${i}">
          <span class="name">${highlightMatch(s.nomeCompleto, q)}</span>
          <span class="class-tag">${escapeHtml(s.turma)}</span>
        </div>`).join('');
      dropdown.classList.add('open');

      dropdown.querySelectorAll('.autocomplete-item').forEach(item => {
        item.addEventListener('mousedown', e => {
          e.preventDefault();
          selectStudent(currentMatches[+item.dataset.index]);
        });
      });
    }

    function closeAutocomplete() {
      document.getElementById("autocompleteDropdown").classList.remove('open');
      highlightedIndex = -1;
      currentMatches = [];
    }

    function selectStudent(aluno) {
      document.getElementById("searchInput").value = aluno.nomeCompleto;
      document.getElementById("btnClear").classList.remove("hidden");
      closeAutocomplete();
      renderBoletim(aluno);
    }

    // ✅ Limpar pesquisa
    function clearSearch() {
      document.getElementById("searchInput").value = "";
      document.getElementById("btnClear").classList.add("hidden");
      closeAutocomplete();
      document.getElementById("boletimCard").classList.remove("active");
      document.getElementById("searchInput").focus();
    }

    // ------------------- Renderizar Boletim Individual -------------------
    function renderBoletim(aluno) {
      document.getElementById("studentName").textContent = aluno.nomeCompleto;
      document.getElementById("studentClass").textContent = aluno.turma;
      document.getElementById("studentAvg").textContent = aluno.mediaGeral.toFixed(1);
      document.getElementById("studentBelowCount").textContent = aluno.abaixo;

      const alertBox = document.getElementById("criticalAlert");
      if (aluno.abaixo >= 3) {
        document.getElementById("criticalText").textContent = 
          `${aluno.abaixo} disciplinas com nota abaixo da média (18). Atenção!`;
        alertBox.style.display = "flex";
      } else {
        alertBox.style.display = "none";
      }

      const tbody = document.getElementById("gradesBody");
      tbody.innerHTML = "";
      aluno.disciplinas.forEach((disc, i) => {
        media = aluno.medias[i];
        abaixo = media !== null && media < 18;
        tr = document.createElement("tr");
        tr.innerHTML = `
          <td><strong>${escapeHtml(disc.nome)}</strong></td>
          <td class="grade-value ${disc.trim1 !== null ? (disc.trim1 < 18 ? 'grade-danger' : '') : ''}">
            ${disc.trim1 !== null ? disc.trim1.toFixed(1) : '—'}
          </td>
          <td class="grade-value ${disc.trim2 !== null ? (disc.trim2 < 18 ? 'grade-danger' : '') : ''}">
            ${disc.trim2 !== null ? disc.trim2.toFixed(1) : '—'}
          </td>
          <td style="color: ${abaixo ? 'var(--danger)' : 'var(--success)'}">
            ${abaixo ? '🔴 Abaixo' : media !== null ? '🟢 Ok' : '⏳ Parcial'}
          </td>`;
        tbody.appendChild(tr);
      });

      document.getElementById("boletimCard").classList.add("active");
    }

    // ------------------- Boletim por Turma -------------------
    document.getElementById("classSelect").addEventListener("change", e => {
      const turma = e.target.value;
      if (!turma) {
        document.getElementById("classBoletimCard").style.display = "none";
        document.getElementById("trimestreFilter").style.display = "none";
        currentTurmaSelecionada = null;
        return;
      }
      currentTurmaSelecionada = turma;
      trimestreAtual = 'todos';
      document.querySelectorAll('.trimestre-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.trimestre === 'todos');
      });
      document.getElementById("trimestreFilter").style.display = "flex";
      renderClassBoletim(turma);
    });

    // 🔘 Trocar trimestre
    document.querySelectorAll('.trimestre-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.trimestre-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        trimestreAtual = btn.dataset.trimestre;
        if (currentTurmaSelecionada) {
          renderClassBoletim(currentTurmaSelecionada);
        }
      });
    });

    function renderClassBoletim(turma) {
      const alunos = allClasses[turma];
      if (!alunos) return;

      document.getElementById("classTitle").textContent = `Boletim — ${turma}`;

      const disciplinas = [...new Set(alunos.flatMap(a => a.disciplinas.map(d => d.nome)))].sort();

      // Cabeçalho
      const thead = document.getElementById("classTableHead");
      let cabecalhoHtml = `<tr><th>Nome</th>`;
      
      if (trimestreAtual === 'todos') {
        disciplinas.forEach(d => {
          cabecalhoHtml += `<th colspan="2">${escapeHtml(d)}</th>`;
        });
      } else {
        disciplinas.forEach(d => {
          cabecalhoHtml += `<th>${escapeHtml(d)}</th>`;
        });
      }
      cabecalhoHtml += `</tr>`;

      if (trimestreAtual === 'todos') {
        cabecalhoHtml += `<tr><th></th>`;
        disciplinas.forEach(() => {
          cabecalhoHtml += `<th style="font-size:0.7rem; background:#1e40af;">1º</th><th style="font-size:0.7rem; background:#1e40af;">2º</th>`;
        });
        cabecalhoHtml += `</tr>`;
      }
      
      thead.innerHTML = cabecalhoHtml;

      // Corpo
      const tbody = document.getElementById("classTableBody");
      tbody.innerHTML = "";
      alunos.sort((a,b) => a.nomeCompleto.localeCompare(b.nomeCompleto)).forEach(aluno => {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${escapeHtml(aluno.nome)}</td>`;
        
        disciplinas.forEach(nomeDisc => {
          const disc = aluno.disciplinas.find(d => d.nome === nomeDisc);
          
          if (trimestreAtual === 'todos') {
            // Os dois trimestres
            const val1 = disc?.trim1;
            const val2 = disc?.trim2;
            
            const td1 = document.createElement("td");
            td1.textContent = val1 !== null ? val1.toFixed(1) : "—";
            td1.className = val1 !== null && val1 < 18 ? "grade-danger" : "grade-ok";
            tr.appendChild(td1);
            
            const td2 = document.createElement("td");
            td2.textContent = val2 !== null ? val2.toFixed(1) : "—";
            td2.className = val2 !== null && val2 < 18 ? "grade-danger" : "grade-ok";
            tr.appendChild(td2);
          } else if (trimestreAtual === '1') {
            // Apenas 1º trimestre
            const val = disc?.trim1;
            const td = document.createElement("td");
            td.textContent = val !== null ? val.toFixed(1) : "—";
            td.className = val !== null && val < 18 ? "grade-danger" : "grade-ok";
            tr.appendChild(td);
          } else {
            // Apenas 2º trimestre
            const val = disc?.trim2;
            const td = document.createElement("td");
            td.textContent = val !== null ? val.toFixed(1) : "—";
            td.className = val !== null && val < 18 ? "grade-danger" : "grade-ok";
            tr.appendChild(td);
          }
        });
        
        tbody.appendChild(tr);
      });

      document.getElementById("classBoletimCard").style.display = "block";
    }

    // ------------------- Eventos de Busca -------------------
    const searchInput = document.getElementById("searchInput");
    const btnClear = document.getElementById("btnClear");
    
    searchInput.addEventListener("input", e => updateAutocomplete(e.target.value));
    searchInput.addEventListener("keydown", e => {
      if (!document.getElementById("autocompleteDropdown").classList.contains('open')) return;
      if (e.key === "ArrowDown") {
        e.preventDefault();
        highlightedIndex = (highlightedIndex + 1) % currentMatches.length;
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        highlightedIndex = highlightedIndex <= 0 ? currentMatches.length - 1 : highlightedIndex - 1;
      } else if (e.key === "Enter") {
        e.preventDefault();
        if (highlightedIndex >= 0) selectStudent(currentMatches[highlightedIndex]);
      } else if (e.key === "Escape") {
        clearSearch();
      }
      document.querySelectorAll('.autocomplete-item').forEach((it, i) => {
        it.classList.toggle('highlighted', i === highlightedIndex);
      });
    });
    searchInput.addEventListener("blur", () => setTimeout(() => {
      if (!searchInput.value.trim()) {
        btnClear.classList.add("hidden");
      }
      closeAutocomplete();
    }, 150));
    
    btnClear.addEventListener("click", clearSearch);
  </script>
</body>
</html>
